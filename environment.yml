# Environment configuration for Protein ML Project
name: protein-ml
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  # Core data science packages
  - numpy
  - pandas
  - scikit-learn
  - scipy  # Add scipy which is useful for scientific computing
  
  # Biology specific packages
  - biopython
  
  # Visualization
  - matplotlib
  - seaborn
  
  # Jupyter environment
  - jupyter
  - ipykernel  # Add ipykernel for kernel management
  - ipywidgets  # Add for interactive widgets in Jupyter
  
  # Testing and development
  - pytest
  - sphinx
  
  # Add pip-specific packages
  - pip:
    - nglview
    - biotite
    - requests
    - tqdm
    - pytest-cov
    - black
    - sphinx-rtd-theme
    - pre-commit